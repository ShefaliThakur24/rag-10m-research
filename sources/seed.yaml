# Seed crawl list. Lanes start from these and follow leads they discover.
# Each lane only consumes items in its scope (see lanes/<lane>/BRIEF.md).

papers:
  must_read:
    - { url: "https://arxiv.org/abs/2005.11401", title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", tag: "rag-foundation" }
    - { url: "https://arxiv.org/abs/2310.11511", title: "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection", tag: "self-reflection" }
    - { url: "https://arxiv.org/abs/2305.18654", title: "FActScore: Fine-grained Atomic Evaluation of Factual Precision in Long Form Text Generation", tag: "eval-faithfulness" }
    - { url: "https://arxiv.org/abs/2404.16130", title: "From Local to Global: A Graph RAG Approach to Query-Focused Summarization", tag: "graphrag" }
    - { url: "https://arxiv.org/abs/2112.09118", title: "ColBERTv2: Effective and Efficient Retrieval via Lightweight Late Interaction", tag: "late-interaction" }
    - { url: "https://arxiv.org/abs/2401.18059", title: "RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval", tag: "hierarchical" }
    - { url: "https://arxiv.org/abs/2309.15217", title: "RAGAS: Automated Evaluation of Retrieval Augmented Generation", tag: "eval-framework" }
    - { url: "https://arxiv.org/abs/2403.05676", title: "Searching for Best Practices in Retrieval-Augmented Generation", tag: "survey-best-practices" }
    - { url: "https://arxiv.org/abs/2312.10997", title: "Retrieval-Augmented Generation for Large Language Models: A Survey", tag: "survey" }
    - { url: "https://arxiv.org/abs/2407.01219", title: "Searching for Best Practices in Retrieval-Augmented Generation (extended)", tag: "survey-best-practices" }
    - { url: "https://arxiv.org/abs/2406.14739", title: "Long-context LLMs Meet RAG", tag: "long-context-vs-rag" }
    - { url: "https://arxiv.org/abs/2407.08223", title: "MemoRAG: Moving towards Next-Gen RAG via Memory-Inspired Knowledge Discovery", tag: "memory-rag" }
    - { url: "https://arxiv.org/abs/2403.10131", title: "HippoRAG: Neurobiologically Inspired Long-Term Memory for Large Language Models", tag: "memory-graph" }
    - { url: "https://arxiv.org/abs/2310.06825", title: "Mistral 7B (referenced for instruction-following baselines)", tag: "generation-model" }
    - { url: "https://arxiv.org/abs/2402.03367", title: "DeepSeek LLM RAG eval", tag: "eval" }
    - { url: "https://arxiv.org/abs/2304.06762", title: "REPLUG: Retrieval-Augmented Black-Box Language Models", tag: "blackbox-rag" }
    - { url: "https://arxiv.org/abs/2305.14283", title: "Query Rewriting for Retrieval-Augmented Large Language Models", tag: "query-rewriting" }
    - { url: "https://arxiv.org/abs/2307.03172", title: "Lost in the Middle: How Language Models Use Long Contexts", tag: "context-position" }
    - { url: "https://arxiv.org/abs/2311.09210", title: "Chain-of-Verification Reduces Hallucination in Large Language Models", tag: "verification" }
    - { url: "https://arxiv.org/abs/2402.10612", title: "FaithDial (faithfulness benchmark for dialog)", tag: "eval-faithfulness" }
  arxiv_queries:
    - "retrieval augmented generation faithfulness production"
    - "RAG hallucination grounding citation"
    - "long context retrieval reranking"
    - "hybrid retrieval BM25 dense"
    - "query rewriting decomposition RAG"
    - "chunk size embedding retrieval"
    - "approximate nearest neighbor billion scale"
    - "embedding model benchmark MTEB"
    - "cross-encoder reranker evaluation"
    - "RAG evaluation framework"

